name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-12  # Intel-based macOS runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print Architecture Info
        run: |
          echo "Machine info:"
          uname -a
          sysctl -n machdep.cpu.brand_string

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "Thuisreis" --add-data "affirmations.txt:." --icon=Thuisreis.icns thuisreis_retro_gui.py
          ls -lh dist/

      - name: Compress .app to zip
        run: |
          cd dist
          zip -r MyApp-macos.zip MyApp.app

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MyApp-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
